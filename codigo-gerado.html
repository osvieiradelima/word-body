<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word & Body — Movimento & Inglês enraizados na Palavra</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root {
    --verde: #7BA05B;
    --azul: #8FB8D8;
    --areia: #F5F0E6;
    --texto: #3A3A3A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--areia); color: var(--texto); }
  header { background: linear-gradient(135deg, var(--verde), var(--azul)); color: #fff; padding: 2rem 1rem; text-align: center; }
  header h1 { font-size: 2.2rem; letter-spacing: 0.02em; }
  header p { font-style: italic; margin-top: 0.3rem; opacity: 0.95; }
  main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  h2 { color: var(--verde); margin-bottom: 1rem; }
  .status { padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-weight: 600; }
  .status.ok { background: #E3F0DC; color: #3E6B27; }
  .status.erro { background: #F9E3E0; color: #8C2F25; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
  .card { background: #fff; border-radius: 12px; padding: 1.2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-top: 4px solid var(--verde); }
  .card h3 { margin-bottom: 0.4rem; }
  .card p { font-size: 0.9rem; margin-bottom: 0.6rem; }
  .tag { display: inline-block; font-size: 0.75rem; background: var(--azul); color: #fff; padding: 0.2rem 0.6rem; border-radius: 20px; margin: 0.2rem 0.2rem 0 0; }
  footer { text-align: center; padding: 2rem 1rem; font-style: italic; color: #777; }
</style>
</head>
<body>
<header>
  <h1>Word &amp; Body</h1>
  <p>Movimento &amp; Inglês enraizados na Palavra</p>
</header>
<main>
  <h2>Biblioteca de Atividades</h2>
  <div id="status" class="status">Conectando ao banco...</div>
  <div id="activities" class="grid"></div>
</main>
<footer>
  <p>"Do you not know that your bodies are temples of the Holy Spirit?" — 1 Corinthians 6:19</p>
</footer>
<script>
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const statusEl = document.getElementById('status');
  const gridEl = document.getElementById('activities');

  async function carregarAtividades() {
    const { data, error } = await supabase
      .from('activities')
      .select('*')
      .order('name');

    if (error) {
      statusEl.className = 'status erro';
      statusEl.textContent = 'Erro ao conectar: ' + error.message;
      return;
    }

    if (!data || data.length === 0) {
      statusEl.className = 'status ok';
      statusEl.textContent = 'Conectado! Ainda não há atividades cadastradas.';
      return;
    }

    statusEl.className = 'status ok';
    statusEl.textContent = 'Conectado! ' + data.length + ' atividade(s) encontrada(s).';

    data.forEach(atividade => {
      const card = document.createElement('div');
      card.className = 'card';
      const tags = [
        atividade.age_group,
        atividade.movement_category,
        atividade.virtue,
        atividade.duration_min ? atividade.duration_min + ' min' : null
      ].filter(Boolean).map(t => '<span class="tag">' + t + '</span>').join('');

      card.innerHTML = '<h3>' + atividade.name + '</h3>' +
        '<p>' + (atividade.description || '') + '</p>' + tags;
      gridEl.appendChild(card);
    });
  }

  carregarAtividades();
</script>
</body>
</html>
